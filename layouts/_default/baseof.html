<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.tagline }}{{ end }}">
{{ $style := resources.Get "css/style.css" | minify }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}">
<script src="{{ "js/gate.js" | relURL }}"></script>
</head>
<body>
{{ partial "header.html" . }}
{{ partial "nav.html" . }}
<main class="site-main">
{{ block "main" . }}{{ end }}
</main>
<footer class="site-footer">
<p>&copy; {{ now.Year }} {{ .Site.Params.author }}</p>
</footer>
</body>
</html>
